<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-key="pageTitle">Central Office</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { background: #f4f6f9; color: #333; }
.dashboard-container { max-width: 1200px; margin: auto; padding: 20px; }
header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #2c3e50; color: #fff; border-radius: 10px; }
header h1 { font-size: 22px; }
header button { background: #e74c3c; border: none; color: #fff; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
header button:hover { background: #c0392b; }

/* Dashboard Stats */
.stats { display: flex; justify-content: space-around; margin: 20px 0; }
.stat-card {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  width: 30%;
  text-align: center;
  cursor: pointer;
  transition: 0.3s;
}
.stat-card:hover { background: #ecf0f1; }
.stat-card h2 { font-size: 20px; margin-bottom: 10px; }
.stat-card p { font-size: 16px; color: #2c3e50; font-weight: bold; }

/* Tabs */
.tabs, .sub-tabs { margin: 20px 0; text-align: center; }
.tabs button, .sub-tabs button {
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin: 6px;
  background: #95a5a6;
  color: #fff;
  transition: 0.3s;
}
.tabs button:hover, .sub-tabs button:hover { background: #7f8c8d; }
.tabs button.active, .sub-tabs button.active { background: #3498db; }

/* Requests */
.request {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  margin-bottom: 20px;
}
.request h3 { margin-bottom: 10px; color: #2c3e50; }
.request p { font-size: 14px; margin: 4px 0; }
button.approve { background: green; color: white; border: none; padding: 6px 12px; border-radius: 6px; margin-top: 10px; cursor: pointer; }
button.reject { background: red; color: white; border: none; padding: 6px 12px; border-radius: 6px; margin-top: 10px; cursor: pointer; margin-left: 10px; }
button.approve:hover { background: darkgreen; }
button.reject:hover { background: darkred; }
textarea { width: 100%; margin-top: 8px; padding: 8px; border-radius: 6px; border: 1px solid #ccc; }

#sectionContainer { margin-top: 30px; padding: 25px; background: #fff; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
</style>
</head>
<body>
<div class="dashboard-container">
<header>
  <h1 data-key="dashboardHeader">Central Office</h1>
  <button onclick="logout()" data-key="logoutBtn">Logout</button>
</header>

<!-- Stats -->
<div class="stats">
  <div class="stat-card" onclick="filterByStatus('All')">
    <h2 data-key="totalRequests">Total Requests</h2>
    <p id="totalCount">0</p>
  </div>
  <div class="stat-card" onclick="filterByStatus('Approved')">
    <h2 data-key="approvedRequests">Approved</h2>
    <p id="approvedCount">0</p>
  </div>
  <div class="stat-card" onclick="filterByStatus('Rejected')">
    <h2 data-key="rejectedRequests">Rejected</h2>
    <p id="rejectedCount">0</p>
  </div>
</div>

<!-- Main Tabs -->
<div class="tabs">
  <button onclick="showSubTabs()" data-key="admissionsTab">Admissions</button>
</div>

<!-- Sub Tabs -->
<div class="sub-tabs" id="subTabs" style="display:none;">
  <button onclick="loadRequests('1st')" data-key="firstYear">1st Year</button>
  <button onclick="loadRequests('2nd')" data-key="secondYear">2nd Year</button>
  <button onclick="loadRequests('3rd')" data-key="thirdYear">3rd Year</button>
  <button onclick="loadRequests('4th')" data-key="finalYear">Final Year (BTech)</button>
  <button onclick="loadRequests('All')" data-key="allYears">All Years</button>
</div>

<div id="admissionRequests"></div>
</div>
<script src="api.js"></script>
<script>
// Translation dictionary
const translations = {
  "en": {
    pageTitle: "Central Office Dashboard",
    dashboardHeader: "Central Office",
    logoutBtn: "Logout",
    totalRequests: "Total Requests",
    approvedRequests: "Approved",
    rejectedRequests: "Rejected",
    admissionsTab: "Admissions",
    firstYear: "1st Year",
    secondYear: "2nd Year",
    thirdYear: "3rd Year",
    finalYear: "Final Year (BTech)",
    allYears: "All Years",
    noRequests: "No requests found.",
    selectYear: "Please select a year to view requests."
  },
  "mr": {
    pageTitle: "केंद्रीय कार्यालय डॅशबोर्ड",
    dashboardHeader: "केंद्रीय कार्यालय",
    logoutBtn: "लॉगआउट",
    totalRequests: "एकूण विनंत्या",
    approvedRequests: "मंजूर",
    rejectedRequests: "रद्द",
    admissionsTab: "प्रवेश",
    firstYear: "पहिला वर्ष",
    secondYear: "दुसरा वर्ष",
    thirdYear: "तिसरा वर्ष",
    finalYear: "अंतिम वर्ष (BTech)",
    allYears: "सर्व वर्षे",
    noRequests: "कोणतीही विनंती सापडली नाही.",
    selectYear: "विनंत्या पाहण्यासाठी कृपया वर्ष निवडा."
  },
  "hi": {
    pageTitle: "केंद्रीय कार्यालय डैशबोर्ड",
    dashboardHeader: "केंद्रीय कार्यालय",
    logoutBtn: "लॉगआउट",
    totalRequests: "कुल अनुरोध",
    approvedRequests: "स्वीकृत",
    rejectedRequests: "अस्वीकृत",
    admissionsTab: "प्रवेश",
    firstYear: "पहला वर्ष",
    secondYear: "दूसरा वर्ष",
    thirdYear: "तीसरा वर्ष",
    finalYear: "अंतिम वर्ष (BTech)",
    allYears: "सभी वर्ष",
    noRequests: "कोई अनुरोध नहीं मिला।",
    selectYear: "कृपया अनुरोध देखने के लिए वर्ष चुनें।"
  }
};

// Apply language from localStorage
window.onload = () => {
  const lang = localStorage.getItem('selectedLanguage') || 'en';

  // Translate elements
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    el.innerText = translations[lang][key] || el.innerText;
  });

  document.title = translations[lang].pageTitle;

  // Update counts initially
  updateCounts();
};

// ---------- Existing Dashboard JS ----------

function showSubTabs() {
  document.getElementById("subTabs").style.display = "block";
  const lang = localStorage.getItem('selectedLanguage') || 'en';
  document.getElementById("admissionRequests").innerHTML = `<p style='text-align:center;'>${translations[lang].selectYear}</p>`;
}

function loadRequests(year='All', statusFilter=null) {
  const container = document.getElementById("admissionRequests");
  container.innerHTML = "";
  let requests = JSON.parse(localStorage.getItem("centralAdmissions")) || [];
  const lang = localStorage.getItem('selectedLanguage') || 'en';

  if (year !== 'All') requests = requests.filter(req => req.year === year);
  if (statusFilter) requests = requests.filter(req => req.status === statusFilter);

  if (requests.length === 0) {
    container.innerHTML = `<p style='text-align:center;'>${translations[lang].noRequests}</p>`;
    return;
  }

  requests.forEach((req, index) => {
    const div = document.createElement("div");
    div.className = "request";
    div.innerHTML = `
      <h3>${req.fullName}</h3>
      <p><b>Father:</b> ${req.fatherName}</p>
      <p><b>Mother:</b> ${req.motherName}</p>
      <p><b>DOB:</b> ${req.birthdate}</p>
      <p><b>Class:</b> ${req.className}</p>
      <p><b>Year:</b> ${req.year}</p>
      <p><b>College:</b> ${req.clgName}</p>
      <p><b>Address:</b> ${req.address}</p>
      <p><b>Caste:</b> ${req.caste}</p>
      <p><b>Father Phone:</b> ${req.fatherPhone}</p>
      <p><b>Mother Phone:</b> ${req.motherPhone}</p>
      <p><b>Personal Phone:</b> ${req.personalPhone}</p>
      <p><b>Aadhar:</b> ${req.aadhar}</p>
      <p><b>Status:</b> ${req.status}</p>
      ${req.status === "Rejected" && req.note ? `<p><b>Rejection Note:</b> ${req.note}</p>` : ""}
      <button class="approve" onclick="updateStatus(${index}, 'Approved')">Approve</button>
      <button class="reject" onclick="showRejectBox(${index})">Reject</button>
      <div id="rejectBox-${index}" style="display:none;">
        <textarea id="rejectNote-${index}" placeholder="Enter reason for rejection..."></textarea>
        <button class="reject" onclick="updateStatus(${index}, 'Rejected')">Submit Rejection</button>
      </div>
    `;
    container.appendChild(div);
  });

  updateCounts();
}

function showRejectBox(index) {
  document.getElementById("rejectBox-"+index).style.display = "block";
}

function updateStatus(index, status) {
  let requests = JSON.parse(localStorage.getItem("centralAdmissions")) || [];
  let wardenNotifications = JSON.parse(localStorage.getItem("wardenNotifications")) || [];
  let studentNotifications = JSON.parse(localStorage.getItem("studentNotifications")) || [];

  if (status === "Rejected") {
    let note = document.getElementById("rejectNote-"+index)?.value || "No reason provided";
    requests[index].status = "Rejected";
    requests[index].note = note;
    studentNotifications.push({ student: requests[index].fullName, message: `Your admission was rejected. Reason: ${note}` });
  } else if (status === "Approved") {
    requests[index].status = "Approved";
    studentNotifications.push({ student: requests[index].fullName, message: "Your admission has been approved!" });
    wardenNotifications.push({ studentData: { profile: requests[index], room: {}, feePending: true } });
  }

  localStorage.setItem("centralAdmissions", JSON.stringify(requests));
  localStorage.setItem("wardenNotifications", JSON.stringify(wardenNotifications));
  localStorage.setItem("studentNotifications", JSON.stringify(studentNotifications));

  alert("Request " + status + "!");
  loadRequests();
}

function filterByStatus(status) {
  loadRequests('All', status === 'All' ? null : status);
}

function updateCounts() {
  let requests = JSON.parse(localStorage.getItem("centralAdmissions")) || [];
  document.getElementById("totalCount").innerText = requests.length;
  document.getElementById("approvedCount").innerText = requests.filter(r => r.status === "Approved").length;
  document.getElementById("rejectedCount").innerText = requests.filter(r => r.status === "Rejected").length;
}

function logout() {
  window.location.href = "centralofficelogin.html";
}
</script>
</body>
</html>
